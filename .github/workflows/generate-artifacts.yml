name: Generate Repo Artifacts

on:
  push:
    branches:
      - development
      - release
    paths-ignore:
      - 'SBOM.md'
      - 'STRUCTURE.md'
  schedule:
    # Weekly refresh catches upstream license/version metadata changes
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: sudo apt-get install -y tree jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate STRUCTURE.md
        run: |
          {
            echo "# Repository Structure"
            echo ""
            echo "_Auto-generated on $(date -u '+%Y-%m-%d %H:%M UTC') from commit \`${GITHUB_SHA::7}\`._"
            echo ""
            echo '```'
            tree -I 'node_modules|target|dist|.git|.venv|__pycache__|.next|.nuxt|build|coverage' -L 4 --dirsfirst
            echo '```'
          } > STRUCTURE.md

      # SBOM source: `cargo metadata --locked` — exact match to Cargo.lock,
      # no external API dependency, no dep-graph indexing wait.
      - name: Generate SBOM.md
        run: |
          cargo metadata --format-version 1 --locked > metadata.json
          {
            echo "# Software Bill of Materials"
            echo ""
            echo "_Auto-generated on $(date -u '+%Y-%m-%d %H:%M UTC') from commit \`${GITHUB_SHA::7}\` via \`cargo metadata --locked\`._"
            echo ""
            echo "| Package | Version | License | Repository |"
            echo "|---------|---------|---------|------------|"
            jq -r '
              .packages
              | map(select(.source != null))
              | sort_by(.name)
              | .[]
              | [
                  (.name // "-"),
                  (.version // "-"),
                  (.license // "-"),
                  (.repository // "-")
                ]
              | @tsv
            ' metadata.json \
            | awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}'
            echo ""
            echo "## Summary"
            echo ""
            echo "- Total third-party packages: $(jq '[.packages[] | select(.source != null)] | length' metadata.json)"
            echo "- Workspace members: $(jq '[.packages[] | select(.source == null)] | length' metadata.json)"
            echo "- Generated by: cargo metadata"
          } > SBOM.md
          rm metadata.json

      # Open a PR instead of pushing directly. The org-level Default Branch
      # Protection ruleset requires PRs to the default branch, so the previous
      # git-auto-commit-action push was rejected (GH006). Tracked in issue #14.
      - name: Open PR with regenerated artifacts
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/regenerate-artifacts
          base: ${{ github.ref_name }}
          delete-branch: true
          add-paths: |
            SBOM.md
            STRUCTURE.md
          commit-message: "chore: regenerate SBOM and STRUCTURE"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "chore: regenerate SBOM and STRUCTURE"
          body: |
            Auto-generated regeneration of `SBOM.md` and `STRUCTURE.md` from commit ${{ github.sha }}.

            Triggered by: `${{ github.event_name }}` on `${{ github.ref_name }}`.
          labels: |
            type:enhancement
            category:improvement
