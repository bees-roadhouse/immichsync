name: Generate Repo Artifacts

# PR-driven SBOM + STRUCTURE regeneration.
#
# Runs on every PR targeting main. Regenerates SBOM.md
# and STRUCTURE.md from the PR's head commit, and if anything changed,
# commits + pushes the update directly onto the PR's head branch using
# the workflow's GITHUB_TOKEN.
#
# Why PR-driven (not post-merge):
#   - The PR that's about to merge carries the artifact update with it ...
#     main is always in sync without a separate "chore: regenerate"
#     PR chasing it.
#   - No need for `can_approve_pull_request_reviews` org-level permission
#     just to open a regen PR ... the workflow pushes directly to the PR
#     branch, which only needs `contents: write` (already declared below
#     and allowed at the repo level).
#
# Loop avoidance:
#   - paths-ignore on SBOM.md/STRUCTURE.md so the workflow's own commit
#     doesn't retrigger this workflow.
#   - GitHub's default security model already prevents GITHUB_TOKEN-driven
#     pushes from retriggering same-repo workflows (no PAT in use here).
#   - Belt + suspenders: the commit step is a no-op when `git diff --quiet`
#     reports no changes, so re-runs with identical state simply exit clean.
#
# Skipping:
#   - Skip the entire job for PRs from forks (head_repository != base_repository).
#     Fork PRs run with a read-only token and can't push back; running the job
#     would just fail at the push step. Maintainer can regenerate post-merge.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'SBOM.md'
      - 'STRUCTURE.md'

permissions:
  contents: write
  # Needed so the job can register check runs against the post-push HEAD
  # SHA (see the "Register check runs on new HEAD" step below) — without
  # this the artifact-regen push would leave required checks blank on
  # the new HEAD and the PR would be permanently un-mergeable.
  checks: write

concurrency:
  group: artifacts-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Regenerate SBOM and STRUCTURE
    runs-on: ubuntu-latest
    # Long enough to wait out the parent's CI runs (see the last step).
    timeout-minutes: 60
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # Use the workflow token so subsequent pushes are authenticated.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tooling
        run: sudo apt-get install -y tree jq

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Generate STRUCTURE.md
        # Header is intentionally stable (no timestamp, no commit SHA). The
        # file changes only when the actual tree structure changes ... most
        # PRs see `git diff --quiet` true on this file and never produce a
        # regen commit. Without this, every PR's regen would push a phantom
        # diff (just timestamp + SHA churn) that conflicts with parallel PRs
        # on merge. The git commit history captures when the file was last
        # regenerated.
        run: |
          {
            echo "# Repository Structure"
            echo ""
            echo "_Auto-generated by \`.github/workflows/generate-artifacts.yml\` via \`tree\`. Excludes build artifacts and tooling caches. The git commit history is the source of \"when was this last refreshed.\"_"
            echo ""
            echo '```'
            tree -I 'node_modules|target|dist|.git|.venv|__pycache__|.next|.nuxt|build|coverage' -L 4 --dirsfirst
            echo '```'
          } > STRUCTURE.md

      # SBOM source: `cargo metadata --locked` — exact match to Cargo.lock,
      # no external API dependency, no dep-graph indexing wait.
      - name: Generate SBOM.md
        # Header is intentionally stable (no timestamp, no commit SHA). Same
        # rationale as STRUCTURE.md ... the file changes only when Cargo.lock
        # changes, eliminating phantom diffs that would block parallel PRs.
        run: |
          cargo metadata --format-version 1 --locked > metadata.json
          {
            echo "# Software Bill of Materials"
            echo ""
            echo "_Auto-generated by \`.github/workflows/generate-artifacts.yml\` via \`cargo metadata --locked\` against \`Cargo.lock\`. The git commit history is the source of \"when was this last refreshed.\"_"
            echo ""
            echo "| Package | Version | License | Repository |"
            echo "|---------|---------|---------|------------|"
            jq -r '
              .packages
              | map(select(.source != null))
              | sort_by(.name)
              | .[]
              | [
                  (.name // "-"),
                  (.version // "-"),
                  (.license // "-"),
                  (.repository // "-")
                ]
              | @tsv
            ' metadata.json \
            | awk -F'\t' '{printf "| %s | %s | %s | %s |\n", $1, $2, $3, $4}'
            echo ""
            echo "## Summary"
            echo ""
            echo "- Total third-party packages: $(jq '[.packages[] | select(.source != null)] | length' metadata.json)"
            echo "- Workspace members: $(jq '[.packages[] | select(.source == null)] | length' metadata.json)"
            echo "- Generated by: cargo metadata"
          } > SBOM.md
          rm metadata.json

      - name: Commit and push if changed
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- SBOM.md STRUCTURE.md; then
            echo "No changes to SBOM.md or STRUCTURE.md ... nothing to commit."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add SBOM.md STRUCTURE.md
          git commit -m "chore: regenerate SBOM and STRUCTURE"
          git push origin HEAD:${{ github.head_ref }}
          NEW_SHA=$(git rev-parse HEAD)
          PARENT_SHA=$(git rev-parse HEAD~1)
          echo "Pushed regenerated artifacts to PR branch ${{ github.head_ref }} as ${NEW_SHA}."
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "new_sha=${NEW_SHA}" >> "$GITHUB_OUTPUT"
          echo "parent_sha=${PARENT_SHA}" >> "$GITHUB_OUTPUT"

      # When the artifact regen pushes a new commit to the PR branch, GitHub's
      # security model prevents that GITHUB_TOKEN push from re-triggering any
      # workflows (loop prevention). The PR's CURRENT HEAD (the artifact
      # commit) then has no check runs at all, and the required checks (repo
      # ruleset 16845497) are evaluated against that HEAD, so the PR would be
      # blocked forever at "waiting for checks".
      #
      # So we register the required checks on the new HEAD ourselves, carrying
      # over the PARENT commit's real results. The artifact commit differs
      # from its parent only in SBOM.md + STRUCTURE.md, which don't affect the
      # build, so the parent's CI verdict is the verdict for this commit too.
      # The step waits for each parent run to finish and copies its actual
      # conclusion. It never stamps a pass it hasn't seen (#87: it used to
      # hard-code success while the real run was still going). "Regenerate
      # SBOM and STRUCTURE" is this job, so it is success.
      #
      # Long-term fix: issue #23 (GitHub App migration). App-token pushes
      # naturally re-trigger workflows, removing this workaround.
      - name: Register check runs on new HEAD
        if: steps.push.outputs.pushed == 'true'
        uses: actions/github-script@v7
        env:
          PARENT_SHA: ${{ steps.push.outputs.parent_sha }}
          NEW_SHA: ${{ steps.push.outputs.new_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const parentSha = process.env.PARENT_SHA;
            const newSha = process.env.NEW_SHA;
            const short = (sha) => sha.substring(0, 7);
            // CI checks whose real result we carry over. Keep in step with
            // the job names in ci.yml and the required checks in the ruleset.
            const ciChecks = ['Build & test', 'Build & test (macOS)'];
            const deadline = Date.now() + 50 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            async function latestRun(name) {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref: parentSha, check_name: name, filter: 'latest',
              });
              return data.check_runs.sort((a, b) => b.id - a.id)[0];
            }

            async function stamp(name, conclusion, title, summary) {
              await github.rest.checks.create({
                owner, repo, name, head_sha: newSha,
                status: 'completed', conclusion,
                output: { title, summary },
              });
              core.info(`${name}: ${conclusion} on ${short(newSha)}`);
            }

            const why = `Background: GITHUB_TOKEN pushes cannot retrigger workflows, so this check is registered against artifact-regen commit \`${short(newSha)}\`, which changes only \`SBOM.md\` and \`STRUCTURE.md\`. See \`.github/workflows/generate-artifacts.yml\`, #87 and #23.`;

            await stamp('Regenerate SBOM and STRUCTURE', 'success',
              'Regenerate SBOM and STRUCTURE (this job)', why);

            for (const name of ciChecks) {
              let run = await latestRun(name);
              while ((!run || run.status !== 'completed') && Date.now() < deadline) {
                core.info(`${name}: waiting for the parent run on ${short(parentSha)} (${run ? run.status : 'not started'})`);
                await sleep(30 * 1000);
                run = await latestRun(name);
              }
              if (!run || run.status !== 'completed') {
                await stamp(name, 'failure', `${name}: no finished run on the parent commit`,
                  `No completed "${name}" run was found on parent \`${short(parentSha)}\` within 50 minutes, so no result can be carried over. Re-run CI (push an empty commit) to get a real one.\n\n${why}`);
                continue;
              }
              await stamp(name, run.conclusion, `${name}: ${run.conclusion} (from parent ${short(parentSha)})`,
                `Carried over from the real run on parent \`${short(parentSha)}\`: ${run.html_url}\n\n${why}`);
            }
