name: Release

# Publish a release by pushing a `vX.Y.Z` tag on `main`:
#
#   1. Bump `version` in Cargo.toml in a PR and merge it (the version lives
#      only there; the zip name and the updater both read it).
#   2. Tag the merge commit on main and push the tag:
#        git tag -a v0.3.0 -m "Release v0.3.0" && git push origin v0.3.0
#
# `verify` refuses a tag that doesn't match Cargo.toml or whose commit isn't
# on main. Both platforms build before anything is published, so a failed
# macOS build can't leave a release with only the Windows exe on it.
#
# The retired `release` branch trigger (and its tag-creating path) went with
# the single-main migration (Branching Strategy, 2026-07-05; #122).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag matches Cargo.toml and is on main
        id: version
        shell: bash
        run: |
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $manifest"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "Releasing $manifest from $GITHUB_SHA"

  build-windows:
    name: Build Windows exe
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
        env:
          CARGO_TARGET_DIR: target

      - name: Build release binary
        run: cargo build --release --locked
        env:
          CARGO_TARGET_DIR: target

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/immichsync.exe
          if-no-files-found: error

  build-macos:
    # Ad-hoc signed until the Developer ID exists (#93): set the
    # MACOS_SIGN_IDENTITY secret (and import the cert) to sign for real. See
    # packaging/macos/make-app.sh.
    name: Build macOS app
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
        env:
          CARGO_TARGET_DIR: target

      - name: Build ImmichSync.app
        run: packaging/macos/make-app.sh target/macos
        env:
          CARGO_TARGET_DIR: target

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/macos/ImmichSync-${{ needs.verify.outputs.version }}-macos-arm64.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ImmichSync ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/immichsync.exe
            dist/ImmichSync-${{ needs.verify.outputs.version }}-macos-arm64.zip
          fail_on_unmatched_files: true
