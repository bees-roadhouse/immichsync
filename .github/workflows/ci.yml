name: CI

# Build, test, and attach the binary as a workflow artifact.
#
# CI fires on pull_request only. Work branches don't trigger builds on
# direct push — engineers test locally before opening a PR. Once a PR is
# open, every commit pushed to it re-triggers CI via pull_request:synchronize.
# After the PR squash-merges, the development branch's new SHA represents
# the same source tree as the PR head; we don't rebuild it. The PR's last
# successful build is the canonical "current development" artifact.
#
# Direct pushes to development bypass CI entirely (and per branch policy,
# shouldn't happen — PRs only). Release publishes are handled by the
# separate release.yml workflow on push to release / v* tag.
#
# Artifact naming uses the PR's head ref (the work branch name) and the
# head commit SHA. Format:
#   immichsync-{version}-{branch-slug}-{sha}.exe

on:
  pull_request:
    branches: [development, release]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

jobs:
  build-and-test:
    name: Build & test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          # Repo's .cargo/config.toml hardcodes a target-dir for a specific
          # developer machine; override here with a CI-friendly path so the
          # cache key matches between runs.
          workspaces: ". -> target"
        env:
          CARGO_TARGET_DIR: target

      - name: Test
        # `cargo test` builds in debug mode and runs all tests. This is the
        # actual signal we care about on PRs — does it compile, do tests pass.
        # The release build (with optimizer, linker, ~10 min on Windows) is
        # deferred to release.yml on push to release / v* tag.
        run: cargo test --locked
        env:
          CARGO_TARGET_DIR: target

      - name: Check (release)
        # Cheap safety net for "release-only compile failures" without paying
        # the full release-build cost. `cargo check` skips linking and most
        # optimization — verifies the source compiles under the release profile
        # in ~30s. If this passes, the release.yml build is virtually certain
        # to succeed. If it fails, we catch the regression in PR rather than
        # at release time.
        run: cargo check --release --locked
        env:
          CARGO_TARGET_DIR: target

      - name: Clippy
        # Gating after the issue #9 cleanup. Run `cargo clippy --all-targets
        # -- -D warnings` locally before opening a PR; CI fails otherwise.
        run: cargo clippy --all-targets -- -D warnings
        env:
          CARGO_TARGET_DIR: target

      - name: Format check
        # Gating after the v0.2.0 cargo fmt sweep (issue #8).
        # Run `cargo fmt --all` locally before opening a PR; CI fails otherwise.
        run: cargo fmt --all -- --check
