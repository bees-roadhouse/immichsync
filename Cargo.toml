[package]
name = "immichsync"
version = "0.2.3"
edition = "2021"
description = "Windows and macOS tray app that syncs photos/videos to Immich"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/bees-roadhouse/immichsync"
homepage = "https://github.com/bees-roadhouse/immichsync"
keywords = ["immich", "windows", "macos", "tray", "photos"]
categories = ["multimedia::images", "command-line-utilities"]
authors = ["Bee's Roadhouse"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Filesystem watching
notify = "7"
notify-debouncer-full = "0.4"

# HTTP client
reqwest = { version = "0.12", features = ["multipart", "json", "stream", "blocking"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# System tray
tray-icon = "0.19"
winit = "0.30"

# GUI
eframe = "0.29"
egui = "0.29"

# Hashing
sha1 = "0.10"

# EXIF parsing
kamadak-exif = "0.5"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"

# Utility
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
hostname = "0.4"
glob = "0.3"
thiserror = "2"
anyhow = "1"

# Encryption for API key storage
aes-gcm = "0.10"
base64 = "0.22"

# Async trait support (used in upload/worker.rs and api/)
async-trait = "0.1"

# Folder picker dialog
rfd = "0.15"

# Open URLs in browser
open = "5"

# Semantic versioning
semver = "1"

# Streaming I/O utilities (bandwidth throttling, file → byte stream for uploads)
tokio-util = { version = "0.7", features = ["io"] }

# Stream combinators (for throttled upload bodies)
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# ── Platform-specific ───────────────────────────────────────────────
# Everything OS-specific is reached only through src/platform/ (see
# docs/adr/0001-macos-platform-seam.md).

[target.'cfg(windows)'.dependencies]
# Windows APIs
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_UI_Shell",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # single_instance.rs  — CreateMutexW
    "Win32_System_Threading",
    # autostart.rs        — RegOpenKeyExW, RegSetValueExW, RegDeleteValueW, etc.
    "Win32_System_Registry",
    # known_folders.rs    — CoTaskMemFree (frees PWSTR from SHGetKnownFolderPath)
    "Win32_System_Com",
    # shortcuts.rs        — IPropertyStore, PROPERTYKEY (AppUserModelID on .lnk)
    "Win32_UI_Shell_PropertiesSystem",
] }

# Windows toast notifications
winrt-notification = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
# NSApplication pump for the menu-bar app (same majors tray-icon/winit pull in)
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDate", "NSError", "NSRunLoop", "NSSortDescriptor", "NSString", "NSURL", "NSUUID"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSResponder", "NSRunningApplication"] }
# API key in the login Keychain (already in the tree via native-tls)
security-framework = "3"
# Notification Center (bundled builds only)
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "0.6"
# Photos library source (docs/adr/0002-photokit-library-source.md): read-only
# use of PhotoKit. No PHAssetChangeRequest anywhere; review greps for it.
objc2-photos = { version = "0.3", default-features = false, features = ["std", "block2", "PHAsset", "PHAssetResource", "PHAssetResourceManager", "PHError", "PHFetchOptions", "PHFetchResult", "PHObject", "PHPhotoLibrary", "PhotosTypes"] }
# flock (single instance), signal (graceful SIGTERM/SIGINT)
libc = "0.2"

# Temp files in tests
[dev-dependencies]
tempfile = "3"

# Build-time icon pipeline:
# - Read assets/icon-source.webp via `image`
# - Generate a multi-resolution .ico via `ico`
# - Embed the .ico as the EXE resource icon via `winresource`
# All three are build-only; nothing at runtime depends on them.
[build-dependencies]
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
ico = "0.4"
winresource = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
